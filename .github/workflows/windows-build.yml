name: Windows build

# Ветка windows: Windows-порт KarinCore. Каждый push собирает установщик (артефакт на 14 дней).
# Коммит с сообщением, начинающимся с "release:", дополнительно публикует пре-релиз
# windows-v<VERSION>; «Latest» на GitHub остаётся за Linux-версией.

on:
  workflow_dispatch:
  push:
    branches: ["windows"]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Код общий с Linux-версией: убеждаемся, что Linux-сборка и тесты не сломались.
  linux-checks:
    name: Linux (tests, helper clippy)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version metadata
        run: python3 scripts/check-version.py
      # tauri::generate_context!() требует собранный frontendDist
      - run: npm run build
      - name: Tests (app and privileged helper)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Clippy (privileged helper — warnings are errors)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --bin karincore-helper -- -D warnings

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version metadata
        run: python scripts/check-version.py
      - name: Build NSIS installer
        run: npm run tauri build -- --bundles nsis
      - name: Check installer
        id: installer
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXE="src-tauri/target/release/bundle/nsis/KarinCore_${VERSION}_x64-setup.exe"
          ls -l src-tauri/target/release/bundle/nsis/
          test -s "$EXE"
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KarinCore-Windows-${{ github.sha }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      # Тесты после сборки: установщик для ручной проверки остаётся в артефактах,
      # даже если какой-то тест на Windows ещё не проходит. Публикацию упавший тест блокирует.
      - name: Tests (app)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --bin karin-proxy

  publish-release:
    name: Publish GitHub pre-release
    needs: [linux-checks, windows]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: KarinCore-Windows-${{ github.sha }}
          path: release-artifact
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="windows-v${VERSION}"
          ASSET="KarinCore-Windows-v${VERSION}-x64-setup.exe"
          cp "release-artifact/KarinCore_${VERSION}_x64-setup.exe" "$ASSET"

          # Заметки — раздел этой версии из CHANGELOG-windows.md.
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { active=1; next }
            active && /^## \[/ { exit }
            active { print }
          ' CHANGELOG-windows.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'KarinCore for Windows v%s\n' "$VERSION" > release-notes.md
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            EXTRA_ARGS=()
            if [[ "$VERSION" == *-* ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "KarinCore Windows v${VERSION}" \
              --latest=false \
              --notes-file release-notes.md \
              "${EXTRA_ARGS[@]}"
          fi
