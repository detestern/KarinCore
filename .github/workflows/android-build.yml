name: Android build

on:
  workflow_dispatch:
  push:
    branches: ["android"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "scripts/fetch-libv2ray.sh"
      - "VERSION"
      - "CHANGELOG.md"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Android multi-ABI debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.sign.outputs.signed }}

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android platform and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          for attempt in 1 2 3; do
            if "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Android SDK/NDK installation failed after 3 attempts"
              exit 1
            fi

            echo "SDK/NDK install failed on attempt $attempt, clearing partial download and retrying..."
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973" "$ANDROID_HOME/.temp" 2>/dev/null || true
            sleep 5
          done

          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Download Xray Android library
        run: npm run android:core

      - name: Validate version metadata
        run: npm run version:check

      - name: Initialize Tauri Android project
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Build split debug APKs for every ABI
        run: npm run tauri -- android build --apk --target aarch64 armv7 i686 x86_64 --split-per-abi --debug --ci

      # ***************************************
      # PERMANENT SIGNING KEY
      # Android only updates an installed app in place when the new APK is signed
      # with the same key. The key lives in repository secrets (see
      # docs/ANDROID_SIGNING.md). Without it the APKs stay debug-signed.
      # ***************************************
      - name: Sign APKs with the KarinCore release key
        id: sign
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ] || [ -z "${KS_PASS:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "::warning::No release signing key configured. APKs stay debug-signed and cannot update an installed build."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEY_PASS="${KEY_PASS:-$KS_PASS}"
          export KS_PASS KEY_PASS
          KEYSTORE="$RUNNER_TEMP/karincore-release.p12"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KS_B64" | base64 -d > "$KEYSTORE"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          OUTPUTS="src-tauri/gen/android/app/build/outputs"
          COUNT=0
          while IFS= read -r APK; do
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --v4-signing-enabled false "$APK"
            "$APKSIGNER" verify "$APK"
            COUNT=$((COUNT + 1))
          done < <(find "$OUTPUTS" -type f -name '*.apk')

          if [ "$COUNT" -eq 0 ]; then
            echo "No APKs found to sign"
            exit 1
          fi

          # Every APK must carry the very same certificate.
          FINGERPRINTS="$(find "$OUTPUTS" -type f -name '*.apk' -exec "$APKSIGNER" verify --print-certs {} \; \
            | grep -i 'certificate SHA-256 digest' | sort -u)"
          echo "$FINGERPRINTS"
          if [ "$(printf '%s\n' "$FINGERPRINTS" | wc -l)" -ne 1 ]; then
            echo "APKs are signed with different certificates"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Verify ABI, Xray geodata, permissions and widget resources
        shell: bash
        run: |
          set -euo pipefail
          OUTPUTS="src-tauri/gen/android/app/build/outputs"
          find_apk_for_abi() {
            local root="$1" abi="$2" candidate
            while IFS= read -r candidate; do
              if unzip -Z1 "$candidate" | grep -Fx "lib/${abi}/libkarin_proxy_lib.so" >/dev/null; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done < <(find "$root" -type f -name '*.apk')
            return 1
          }

          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            if ! APK="$(find_apk_for_abi "$OUTPUTS" "$ABI")"; then
              echo "Missing APK for $ABI"
              exit 1
            fi

            unzip -Z1 "$APK" | grep -Fx "lib/${ABI}/libkarin_proxy_lib.so"
            unzip -Z1 "$APK" | grep -Fx "lib/${ABI}/libgojni.so"
            unzip -Z1 "$APK" | grep -Fx 'assets/geoip.dat'
            unzip -Z1 "$APK" | grep -Fx 'assets/geosite.dat'
            unzip -Z1 "$APK" | grep -Fx 'res/layout/karin_vpn_widget.xml'
            unzip -Z1 "$APK" | grep -Fx 'res/xml/karin_vpn_widget_info.xml'
            MANIFEST="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK")"
            grep -F 'com.nikitahya.karincore.vpn.KarinVpnWidgetProvider' <<< "$MANIFEST"
            grep -F 'android.permission.POST_NOTIFICATIONS' <<< "$MANIFEST"
          done

      - name: List APK outputs
        if: always()
        shell: bash
        run: |
          find src-tauri/gen/android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print 2>/dev/null || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KarinCore-Android-${{ github.sha }}-multi-abi-debug
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub prerelease
    needs: android-debug
    # APKs signed with the permanent release key can be published as is.
    # Debug-signed APKs are test artifacts and need either the repository
    # opt-in or an explicit marker in the release commit itself.
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:') && (needs.android-debug.outputs.signed == 'true' || vars.ALLOW_DEBUG_PRERELEASE == 'true' || contains(github.event.head_commit.message, '[publish-debug]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download verified build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: KarinCore-Android-${{ github.sha }}-multi-abi-debug
          path: release-artifact

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="android-v${VERSION}"
          find_apk_for_abi() {
            local root="$1" abi="$2" candidate
            while IFS= read -r candidate; do
              if unzip -Z1 "$candidate" | grep -Fx "lib/${abi}/libkarin_proxy_lib.so" >/dev/null; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done < <(find "$root" -type f -name '*.apk')
            return 1
          }

          RELEASE_APKS=()
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            if ! APK="$(find_apk_for_abi release-artifact "$ABI")"; then
              echo "APK not found for $ABI"
              exit 1
            fi

            RELEASE_APK="KarinCore-Android-v${VERSION}-${ABI}-debug.apk"
            cp "$APK" "$RELEASE_APK"
            RELEASE_APKS+=("$RELEASE_APK")
          done

          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { active=1; next }
            active && /^## \[/ { exit }
            active { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            printf 'KarinCore Android v%s\n' "$VERSION" > release-notes.md
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${RELEASE_APKS[@]}" --clobber
          else
            EXTRA_ARGS=()
            if [[ "$VERSION" == *-* ]]; then
              EXTRA_ARGS+=(--prerelease)
            fi

            gh release create "$TAG" "${RELEASE_APKS[@]}" \
              --target "$GITHUB_SHA" \
              --title "KarinCore Android v${VERSION}" \
              --latest=false \
              --notes-file release-notes.md \
              "${EXTRA_ARGS[@]}"
          fi
