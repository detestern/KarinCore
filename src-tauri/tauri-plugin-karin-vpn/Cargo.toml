[package]
name = "tauri-plugin-karin-vpn"
version = "0.1.0-alpha.33"
description = "Android VpnService bridge for KarinCore"
edition = "2021"
links = "tauri-plugin-karin-vpn"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2"
thiserror = "2"
