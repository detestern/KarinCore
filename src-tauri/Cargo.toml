[package]
name = "karin-proxy"
version = "0.1.0-alpha.1"
description = "KarinCore - Modern and secure proxy client"
authors = ["detestern <detestern@proton.me>"]
edition = "2021"
default-run = "karin-proxy"

[[bin]]
name = "karin-proxy"
path = "src/main.rs"

# Привилегированный helper (запускается через sudo от root, std-only, без зависимостей).
# На Windows это служба KarinCore (karincore-service.exe); там она использует windows-sys —
# только объявления функций Win32 от Microsoft, без собственного кода.
[[bin]]
name = "karincore-helper"
path = "helper/main.rs"

[lib]
name = "karin_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
tokio = { version = "1.52.3", features = ["full"] }
base64 = "0.21"
rfd = "0.17.2"

# Только для Windows: уведомления и буфер обмена через официальные плагины Tauri
# (на Linux — notify-send и wl-paste/xclip). Версии ограничены так, чтобы не тянуть tauri 2.12+:
# версия крейта tauri должна совпадать по minor с @tauri-apps/api, иначе `tauri build` откажется собирать.
[target.'cfg(windows)'.dependencies]
tauri-plugin-notification = "~2.4"
tauri-plugin-clipboard-manager = "~2.3"
# Win32 API для службы (канал, права, SCM) и для клиента службы в GUI. 0.61 уже есть в дереве зависимостей Tauri.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
] }
