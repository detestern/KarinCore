[package]
name = "karin-proxy"
version = "1.8.3"
description = "KarinCore - Modern and secure proxy client"
authors = ["detestern <detestern@proton.me>"]
edition = "2021"
default-run = "karin-proxy"

[[bin]]
name = "karin-proxy"
path = "src/main.rs"

# Привилегированный helper (запускается через sudo от root, std-only, без зависимостей).
[[bin]]
name = "karincore-helper"
path = "helper/main.rs"

[lib]
name = "karin_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
tokio = { version = "1.52.3", features = ["full"] }
base64 = "0.21"
rfd = "0.17.2"
