[package]
name = "karin-proxy"
version = "0.1.0-alpha.32"
description = "KarinCore Android - Android port of the KarinCore proxy client"
authors = ["detestern <detestern@proton.me>", "VivaGushter"]
edition = "2021"
default-run = "karin-proxy"

[lib]
name = "karin_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-karin-vpn = { path = "tauri-plugin-karin-vpn" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
tokio = { version = "1.52.3", features = ["full"] }
base64 = "0.21"
getrandom = "0.3"
percent-encoding = "2.3"

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls", "charset", "http2"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["json", "native-tls", "charset", "http2", "system-proxy"] }
rfd = "0.17.2"


# Android alpha builds use the Cargo dev profile so they remain debug-installable,
# but native DWARF/symbol tables make the APK unnecessarily huge. Runtime
# diagnostics are provided by KarinCore's own logs, so native symbols are not
# shipped in test APKs.
[profile.dev]
debug = 0
strip = "symbols"
